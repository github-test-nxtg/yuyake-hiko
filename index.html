<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夕焼け飛行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#191a33; --indigo:#2a2f63; --dusk:#f2a65a; --washi:#efe6d2; --crimson:#d23b52; --teal:#3fb0a6;
  --bg:#191a33; --fg:#efe6d2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121326; --fg:#efe6d2; } }
:root[data-theme="dark"]{ --bg:#121326; --fg:#efe6d2; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#stage{position:relative; line-height:0}
canvas{display:block; border-radius:6px; box-shadow:0 0 0 2px #00000040}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; line-height:1.5; text-align:center; padding:24px;
  background:linear-gradient(180deg, #191a33cc, #191a3399 60%, #191a3300);
  border-radius:6px;
}
.screen[hidden]{display:none}
h1{
  font-family:"Dela Gothic One","Hiragino Sans",sans-serif; font-weight:400;
  font-size:clamp(40px,9vw,92px); margin:0; line-height:1; letter-spacing:.04em;
  color:var(--washi); text-shadow:4px 4px 0 var(--crimson), 8px 8px 0 #00000055;
}
.sub{margin:0; font-size:clamp(14px,2vw,18px); color:var(--dusk); font-weight:700}
.how{margin:0; font-size:clamp(12px,1.7vw,15px); opacity:.85; max-width:34em}
.big{font-family:"Dela Gothic One",sans-serif; font-size:clamp(28px,6vw,56px); margin:0; line-height:1.1}
button{
  font:700 clamp(16px,2.2vw,20px) "Zen Kaku Gothic New",system-ui,sans-serif;
  background:var(--crimson); color:var(--washi); border:0; border-radius:999px;
  padding:.6em 2em; cursor:pointer; box-shadow:0 4px 0 #8a1f32; margin-top:6px;
}
button:active{transform:translateY(3px); box-shadow:0 1px 0 #8a1f32}
button:focus-visible{outline:3px solid var(--dusk); outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="screen" id="title">
    <h1>夕焼け飛行</h1>
    <p class="sub">紙ひこうきで夕暮れの空を守れ</p>
    <p class="how">矢印キー / WASD で移動、弾は自動で発射。スマホは画面をドラッグ。<br>敵を1機でも左端まで通すとライフが減る。赤い「P」を取ると弾が強くなる。P キーで一時停止。</p>
    <button id="startBtn">スタート</button>
  </div>
  <div class="screen" id="over" hidden>
    <p class="big">撃墜された</p>
    <p class="sub" id="finalScore"></p>
    <button id="retryBtn">もう一度</button>
  </div>
  <div class="screen" id="paused" hidden>
    <p class="big">一時停止中</p>
    <button id="resumeBtn">再開</button>
  </div>
</div>
<script>
(() => {
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let scale = 1;

function resize(){
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  const cs = getComputedStyle(document.documentElement);
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  scale = Math.min((vw - 16) / W, (vh - pad - 16) / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- storage ----------
let hi = 0;
try { hi = parseInt(localStorage.getItem('yuyake-hi') || '0', 10) || 0; } catch(e){}
function saveHi(){ try { localStorage.setItem('yuyake-hi', String(hi)); } catch(e){} }

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
  if ((e.key === 'Enter' || e.key === ' ') && (state === 'title' || state === 'over')) start();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touch = null;
function toGame(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; const p = toGame(e); touch = { sx:p.x, sy:p.y, px:player.x, py:player.y }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!touch) return; const p = toGame(e); touch.tx = touch.px + (p.x - touch.sx) * 1.3; touch.ty = touch.py + (p.y - touch.sy) * 1.3; });
const endTouch = () => { touch = null; };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);

// ---------- state ----------
let state = 'title';
let player, bullets, eBullets, enemies, particles, items, popups;
let score, t, spawnT, level, nextBoss, boss, shake, flash, leakGrace, leakFlash;

function reset(){
  player = { x:140, y:H/2, r:9, lives:3, power:1, cool:0, inv:2 };
  bullets = []; eBullets = []; enemies = []; particles = []; items = []; popups = [];
  score = 0; t = 0; spawnT = 1; level = 1; nextBoss = 40; boss = null; shake = 0; flash = 0; leakGrace = 0; leakFlash = 0;
}
reset();

function start(){
  reset(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('paused').hidden = true;
  cv.focus?.();
}
function togglePause(){
  if (state === 'play'){ state = 'pause'; $('paused').hidden = false; }
  else if (state === 'pause'){ state = 'play'; $('paused').hidden = true; }
}
$('startBtn').onclick = start; $('retryBtn').onclick = start; $('resumeBtn').onclick = togglePause;
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

// ---------- helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
const hit = (a,b) => { const dx=a.x-b.x, dy=a.y-b.y, r=a.r+b.r; return dx*dx+dy*dy < r*r; };
function burst(x,y,color,n=14,sp=220){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=rand(sp*.3,sp);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),max:.8,color,size:rand(2,5)}); }
}
function aimed(e, speed, spread=0, n=1){
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  for (let i=0;i<n;i++){
    const a = base + (n===1 ? 0 : (i - (n-1)/2) * spread);
    eBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, r:5});
  }
}

// ---------- spawning ----------
function spawnEnemy(){
  const d = Math.min(1 + t/60 + (level-1)*.35, 4);
  const roll = Math.random();
  const y = rand(50, H-60);
  if (roll < .45){
    const n = 3 + Math.floor(Math.random()*3);
    for (let i=0;i<n;i++) enemies.push({type:'dart', x:W+30+i*42, y:y, vx:-(110+20*d), r:13, hp:1, pts:100, ph:0});
  } else if (roll < .8){
    const n = 4;
    for (let i=0;i<n;i++) enemies.push({type:'kite', x:W+30+i*55, y0:y, y:y, vx:-(85+15*d), r:14, hp:2, pts:150, ph:i*.8, amp:rand(50,90)});
  } else {
    enemies.push({type:'lantern', x:W+40, y:y, vx:-80, r:20, hp:5+Math.floor(d*2), pts:300, ph:0, fire:rand(.6,1.2), stop:rand(620,800)});
  }
}
function spawnBoss(){
  boss = {type:'boss', x:W+120, y:H/2, r:54, hp:70+level*40, maxhp:70+level*40, pts:5000, ph:0, fire:2, ring:4, enter:true};
  enemies.push(boss);
  popups.push({text:'大凧 襲来', x:W/2, y:H/2-40, life:2, big:true});
}

// ---------- update ----------
function update(dt){
  t += dt;
  // player movement
  let mx = 0, my = 0;
  if (keys['arrowleft']||keys['a']) mx -= 1;
  if (keys['arrowright']||keys['d']) mx += 1;
  if (keys['arrowup']||keys['w']) my -= 1;
  if (keys['arrowdown']||keys['s']) my += 1;
  const sp = 330;
  if (mx||my){ const l=Math.hypot(mx,my); player.x += mx/l*sp*dt; player.y += my/l*sp*dt; }
  if (touch && touch.tx !== undefined){
    const dx = touch.tx - player.x, dy = touch.ty - player.y;
    const k = Math.min(1, dt*14); player.x += dx*k; player.y += dy*k;
  }
  player.x = Math.max(20, Math.min(W-30, player.x));
  player.y = Math.max(16, Math.min(H-16, player.y));
  player.inv = Math.max(0, player.inv - dt);

  // auto fire
  player.cool -= dt;
  if (player.cool <= 0){
    player.cool = .11;
    const p = player.power, bx = player.x+18, by = player.y;
    const shot = (vy, oy=0) => bullets.push({x:bx, y:by+oy, vx:780, vy, r:4});
    if (p === 1) shot(0);
    else if (p === 2){ shot(0,-6); shot(0,6); }
    else if (p === 3){ shot(0); shot(-130); shot(130); }
    else { shot(0,-5); shot(0,5); shot(-150); shot(150); shot(-300); shot(300); }
  }

  // spawn
  if (!boss){
    spawnT -= dt;
    if (spawnT <= 0){ spawnEnemy(); spawnT = Math.max(.55, 1.8 - t/90 - level*.12); }
    if (t >= nextBoss) spawnBoss();
  }

  // bullets
  for (const b of bullets){ b.x += b.vx*dt; b.y += b.vy*dt; }
  bullets = bullets.filter(b => b.x < W+20 && b.y > -20 && b.y < H+20 && !b.dead);
  for (const b of eBullets){ b.x += b.vx*dt; b.y += b.vy*dt; }
  eBullets = eBullets.filter(b => b.x > -20 && b.x < W+20 && b.y > -20 && b.y < H+20 && !b.dead);

  // enemies
  for (const e of enemies){
    e.ph += dt;
    if (e.type === 'dart'){ e.x += e.vx*dt; }
    else if (e.type === 'kite'){ e.x += e.vx*dt; e.y = e.y0 + Math.sin(e.ph*2)*e.amp; }
    else if (e.type === 'lantern'){
      if (e.x > e.stop) e.x += e.vx*dt; else if (e.ph > 9) { e.y -= 120*dt; e.leaving = true; }
      e.y += Math.sin(e.ph*1.5)*30*dt;
      e.fire -= dt;
      if (e.fire <= 0 && e.x < W-20){ aimed(e, 220 + level*15, .22, level > 1 ? 3 : 1); e.fire = 1.6; }
    }
    else if (e.type === 'boss'){
      if (e.enter){ e.x -= 120*dt; if (e.x <= 790) e.enter = false; }
      else {
        e.y = H/2 + Math.sin(e.ph*.8)*150;
        e.fire -= dt; e.ring -= dt;
        if (e.fire <= 0){ aimed(e, 250, .16, 5 + level); e.fire = Math.max(.7, 1.5 - level*.15); }
        if (e.ring <= 0){
          const n = 14 + level*2, off = Math.random();
          for (let i=0;i<n;i++){ const a = (i/n + off)*Math.PI*2; eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5}); }
          e.ring = 3.2;
        }
      }
    }
    // player bullets vs enemy
    for (const b of bullets){
      if (!b.dead && hit(b,e)){
        b.dead = true; e.hp--; e.hitT = .06;
        if (e.hp <= 0 && !e.dead) killEnemy(e);
      }
    }
    // escaped past the left edge
    if (!e.dead && e.x < -e.r){ e.dead = true; leak(e); }
    if (e.leaving && e.y < -40) e.dead = true;
    // body collision
    if (!e.dead && hit(player,e)) damage();
  }
  enemies = enemies.filter(e => !e.dead && e.x > -80);

  for (const b of eBullets){ if (hit({x:player.x,y:player.y,r:5}, b)){ b.dead = true; damage(); } }

  // items
  for (const it of items){
    it.x -= 90*dt; it.y += Math.sin(t*4 + it.ph)*40*dt;
    const dx = player.x - it.x, dy = player.y - it.y, dd = Math.hypot(dx,dy);
    if (dd < 110){ it.x += dx/dd*260*dt; it.y += dy/dd*260*dt; }
    if (dd < 24){
      it.dead = true;
      if (player.power < 4){ player.power++; popups.push({text:'パワーアップ', x:player.x, y:player.y-24, life:1}); }
      else { score += 1000; popups.push({text:'+1000', x:player.x, y:player.y-24, life:1}); }
    }
  }
  items = items.filter(i => !i.dead && i.x > -30);

  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups){ p.life -= dt; p.y -= (p.big ? 0 : 30*dt); }
  popups = popups.filter(p => p.life > 0);
  for (const e of enemies) if (e.hitT) e.hitT -= dt;
  shake = Math.max(0, shake - dt*30);
  leakGrace = Math.max(0, leakGrace - dt);
  leakFlash = Math.max(0, leakFlash - dt*2);
  flash = Math.max(0, flash - dt*3);
}

function killEnemy(e){
  e.dead = true;
  score += e.pts;
  const col = e.type === 'kite' ? '#3fb0a6' : e.type === 'dart' ? '#efe6d2' : '#d23b52';
  burst(e.x, e.y, col, e.type === 'boss' ? 80 : 16, e.type === 'boss' ? 420 : 220);
  burst(e.x, e.y, '#f2a65a', e.type === 'boss' ? 40 : 8, 160);
  if (e.type === 'boss'){
    shake = 18; flash = 1; boss = null; eBullets.forEach(b => { burst(b.x,b.y,'#f2a65a',2,60); }); eBullets = [];
    popups.push({text:'撃破！ +5000', x:W/2, y:H/2-40, life:2, big:true});
    level++; nextBoss = t + 45;
    for (let i=0;i<2;i++) items.push({x:e.x+rand(-20,20), y:e.y+rand(-30,30), r:10, ph:Math.random()*6});
  } else {
    shake = Math.max(shake, e.type === 'lantern' ? 5 : 2);
    const chance = e.type === 'lantern' ? .5 : .06;
    if (Math.random() < chance) items.push({x:e.x, y:e.y, r:10, ph:Math.random()*6});
  }
}

function leak(e){
  leakFlash = 1;
  // 同じ編隊が続けて抜けても1回分だけ減らす
  if (leakGrace > 0 || state !== 'play') return;
  leakGrace = 1.5; shake = 10;
  popups.push({text:'突破された！', x:W/2, y:H/2-40, life:1.4, big:true});
  loseLife();
}
function damage(){
  if (player.inv > 0) return;
  loseLife();
  player.inv = 2; shake = 12; flash = .6;
  burst(player.x, player.y, '#efe6d2', 30, 300);
  eBullets = eBullets.filter(b => Math.hypot(b.x-player.x, b.y-player.y) > 160);
}
function loseLife(){
  player.lives--; player.power = Math.max(1, player.power-1);
  if (player.lives <= 0){
    state = 'over';
    const isHi = score > hi;
    if (isHi){ hi = score; saveHi(); }
    $('finalScore').textContent = `スコア ${score.toLocaleString()}` + (isHi ? '　ハイスコア更新！' : `　(ハイスコア ${hi.toLocaleString()})`);
    setTimeout(() => { $('over').hidden = false; $('retryBtn').focus(); }, 700);
  }
}

// ---------- background ----------
const stars = Array.from({length:70}, () => ({x:Math.random()*W, y:Math.random()*H*.6, s:Math.random()*1.6+.4, sp:rand(8,25)}));
let scroll = 0;
const ridge = (x, seed, amp) => Math.sin(x*.004+seed)*amp + Math.sin(x*.011+seed*2)*amp*.45 + Math.sin(x*.027+seed*3)*amp*.18;

function drawBg(dt){
  scroll += dt * 60;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1d2050'); g.addColorStop(.45,'#4b3a78'); g.addColorStop(.75,'#c86a6a'); g.addColorStop(1,'#f2a65a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle = '#ffd59a'; ctx.globalAlpha = .9;
  ctx.beginPath(); ctx.arc(700, H*.72, 70, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // stars
  for (const s of stars){
    s.x -= s.sp*dt; if (s.x < 0) s.x += W;
    ctx.fillStyle = `rgba(239,230,210,${.3 + .5*Math.abs(Math.sin(t*2+s.x))})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // ridges
  const layers = [
    {sp:.25, base:H*.78, amp:46, seed:1.3, col:'#7a4a7a'},
    {sp:.55, base:H*.86, amp:38, seed:4.1, col:'#4a2f5e'},
    {sp:1.1, base:H*.95, amp:24, seed:7.7, col:'#241c3d'},
  ];
  for (const L of layers){
    ctx.fillStyle = L.col; ctx.beginPath(); ctx.moveTo(0,H);
    const off = scroll*L.sp;
    for (let x=0;x<=W;x+=12) ctx.lineTo(x, L.base - ridge(x+off, L.seed, L.amp) - L.amp*.6);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }
}

// ---------- draw ----------
function drawPlayer(){
  if (player.inv > 0 && Math.floor(player.inv*12)%2 === 0 && state === 'play') return;
  const {x,y} = player;
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(Math.max(-.25, Math.min(.25, ((touch?.ty ?? y) - y) * .01)));
  // trail
  ctx.fillStyle = 'rgba(242,166,90,.5)';
  ctx.beginPath(); ctx.moveTo(-14,-3); ctx.lineTo(-30 - Math.random()*10, 0); ctx.lineTo(-14,3); ctx.fill();
  // paper plane
  ctx.fillStyle = '#efe6d2';
  ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(-16,-14); ctx.lineTo(-8,0); ctx.lineTo(-16,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c9bea6';
  ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(-8,0); ctx.lineTo(-16,14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d23b52'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10,-7); ctx.lineTo(4,-2); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  const white = e.hitT > 0;
  if (e.type === 'dart'){
    ctx.fillStyle = white ? '#fff' : '#1b1b30';
    ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(12,-11); ctx.lineTo(6,0); ctx.lineTo(12,11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2a65a'; ctx.beginPath(); ctx.arc(2,0,2.5,0,Math.PI*2); ctx.fill();
  } else if (e.type === 'kite'){
    ctx.rotate(Math.sin(e.ph*3)*.3);
    ctx.fillStyle = white ? '#fff' : '#3fb0a6';
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(13,0); ctx.lineTo(0,16); ctx.lineTo(-13,0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1b5f5a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,16); ctx.moveTo(-13,0); ctx.lineTo(13,0); ctx.stroke();
    ctx.strokeStyle = '#efe6d2'; ctx.beginPath(); ctx.moveTo(13,0);
    for (let i=1;i<5;i++) ctx.lineTo(13+i*6, Math.sin(e.ph*8+i)*4); ctx.stroke();
  } else if (e.type === 'lantern'){
    ctx.fillStyle = 'rgba(242,166,90,.25)'; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = white ? '#fff' : '#d23b52';
    ctx.beginPath(); ctx.ellipse(0,0,17,21,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1b1b30'; ctx.fillRect(-9,-24,18,5); ctx.fillRect(-9,19,18,5);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
    for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.ellipse(0,0,17*Math.abs(i*.6||.01),21,0,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle = '#ffd59a'; ctx.beginPath(); ctx.arc(-1,0,4,0,Math.PI*2); ctx.fill();
  } else if (e.type === 'boss'){
    ctx.rotate(Math.sin(e.ph*1.2)*.08);
    ctx.fillStyle = white ? '#fff' : '#efe6d2';
    ctx.fillRect(-50,-60,100,120);
    ctx.strokeStyle = '#1b1b30'; ctx.lineWidth = 4; ctx.strokeRect(-50,-60,100,120);
    ctx.fillStyle = '#d23b52'; ctx.beginPath(); ctx.arc(0,-6,30,0,Math.PI*2); ctx.fill();
    // face
    ctx.fillStyle = '#1b1b30';
    ctx.beginPath(); ctx.moveTo(-22,-14); ctx.lineTo(-6,-8); ctx.lineTo(-20,-4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22,-14); ctx.lineTo(6,-8); ctx.lineTo(20,-4); ctx.fill();
    ctx.fillRect(-12,8,24,4);
    ctx.font = '22px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('凧', 0, 50);
    // tails
    ctx.strokeStyle = '#d23b52'; ctx.lineWidth = 3;
    for (const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(50, s*40);
      for (let i=1;i<7;i++) ctx.lineTo(50+i*14, s*40 + Math.sin(e.ph*5+i)*8); ctx.stroke(); }
  }
  ctx.restore();
}

function draw(dt){
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake,shake)*.6, rand(-shake,shake)*.6);
  drawBg(dt);

  for (const it of items){
    ctx.save(); ctx.translate(it.x,it.y);
    ctx.fillStyle = '#d23b52'; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#efe6d2'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#efe6d2'; ctx.font = '14px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('P',0,1); ctx.restore();
  }
  for (const e of enemies) drawEnemy(e);

  ctx.fillStyle = '#ffe9b8';
  for (const b of bullets){ ctx.fillRect(b.x-7, b.y-1.5, 14, 3); }
  for (const b of eBullets){
    ctx.fillStyle = '#d23b52'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe9b8'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r-1.5,0,Math.PI*2); ctx.fill();
  }
  if (state !== 'over') drawPlayer();
  for (const p of particles){ ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 左端の防衛ライン
  {
    const lg = ctx.createLinearGradient(0,0,40,0);
    const al = .12 + leakFlash*.6;
    lg.addColorStop(0,`rgba(210,59,82,${al})`); lg.addColorStop(1,'rgba(210,59,82,0)');
    ctx.fillStyle = lg; ctx.fillRect(0,0,40,H);
  }
  if (flash > 0){ ctx.fillStyle = `rgba(255,233,184,${flash*.5})`; ctx.fillRect(0,0,W,H); }

  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups){
    ctx.globalAlpha = Math.min(1, p.life*2);
    ctx.font = p.big ? '44px "Dela Gothic One", sans-serif' : '16px "Zen Kaku Gothic New", sans-serif';
    if (p.big){ ctx.fillStyle = '#d23b52'; ctx.fillText(p.text, p.x+3, p.y+3); }
    ctx.fillStyle = '#efe6d2'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'title') return;
  // HUD
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '22px "Dela Gothic One", sans-serif'; ctx.fillStyle = '#efe6d2';
  ctx.fillText(score.toLocaleString(), 20, 16);
  ctx.font = '13px "Zen Kaku Gothic New", sans-serif'; ctx.fillStyle = 'rgba(239,230,210,.7)';
  ctx.fillText(`ハイスコア ${Math.max(hi,score).toLocaleString()}　ステージ ${level}`, 20, 44);
  // lives
  for (let i=0;i<player.lives;i++){
    ctx.save(); ctx.translate(W-30-i*30, 28); ctx.scale(.6,.6);
    ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(-16,-14); ctx.lineTo(-8,0); ctx.lineTo(-16,14); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // power
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(239,230,210,.7)';
  ctx.fillText('パワー', W-80, 50);
  for (let i=0;i<4;i++){ ctx.fillStyle = i < player.power ? '#d23b52' : 'rgba(239,230,210,.25)'; ctx.fillRect(W-72+i*14, 51, 10, 12); }
  // boss bar
  if (boss){
    const w = 360, x = (W-w)/2, y = H-26;
    ctx.fillStyle = 'rgba(25,26,51,.6)'; ctx.fillRect(x-2,y-2,w+4,12);
    ctx.fillStyle = '#d23b52'; ctx.fillRect(x,y,w*Math.max(0,boss.hp/boss.maxhp),8);
  }
}

// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'over'){ for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; } particles = particles.filter(p=>p.life>0); t += dt; }
  else if (state === 'title') t += dt;
  draw(state === 'pause' ? 0 : dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
